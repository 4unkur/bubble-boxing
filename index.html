<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Бокс с пузырями</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #3a1240;
      font-family: "Arial Rounded MT Bold", "Baloo 2", system-ui, sans-serif;
      color: #fff;
      user-select: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    video { display: none; }
    #intro {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      background: radial-gradient(circle at 30% 30%, #ff8a5c 0%, #b83a6a 45%, #3a1240 100%);
      text-align: center;
    }
    #intro h1 { font-size: clamp(48px, 9vw, 140px); margin: 0; letter-spacing: 2px; text-shadow: 0 6px 0 rgba(0,0,0,.2); }
    #intro button {
      font: inherit; font-size: clamp(28px, 4vw, 56px);
      padding: 18px 64px; border: none; border-radius: 999px; cursor: pointer;
      background: #ffd23f; color: #6b3d00; box-shadow: 0 8px 0 #c99a10;
    }
    #intro button:active { transform: translateY(4px); box-shadow: 0 4px 0 #c99a10; }
    #intro p { margin: 0; opacity: .85; font-size: clamp(14px, 1.6vw, 22px); line-height: 1.6; }
    #intro .err { color: #ffb3b3; }
  </style>
</head>
<body>
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div id="intro">
    <h1>🥊 Бокс с пузырями 🥊</h1>
    <button id="startBtn">▶ Играть</button>
    <p id="introMsg">
      Встань в 2–3 м от камеры · Бей пузыри, которые летят к тебе!<br />
      Клавиши: <b>F</b> весь экран · <b>Пробел</b> старт / пауза · <b>1 2 3</b> уровень · <b>M</b> без звука · <b>D</b> скелет
    </p>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
